<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Pedir mi Juego</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background-color: #f4f4f4;
    }
    input {
      padding: 10px;
      margin: 10px;
      width: 250px;
      font-size: 16px;
    }
    button {
      padding: 12px 20px;
      background-color: #25D366;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
    }
    button:hover {
      background-color: #1ebe57;
    }
  </style>
</head>
<body>

<h1>Pedí tu Juego</h1>

<input type="text" id="nombre" placeholder="Nombre" />
<br />
<input type="text" id="localidad" placeholder="Localidad" />
<br />
<input type="number" id="cantidad" placeholder="Cantidad" min="1" />
<br />

<button onclick="enviarPedido()">Enviar por WhatsApp</button>

<script>
function enviarPedido() {
  const nombre = document.getElementById("nombre").value.trim();
  const localidad = document.getElementById("localidad").value.trim();
  const cantidad = document.getElementById("cantidad").value.trim();

  if (!nombre || !localidad || !cantidad) {
    alert("Por favor completa todos los campos.");
    return;
  }

  const mensaje = `Hola, quiero pedir el juego.
Nombre: ${nombre}
Localidad: ${localidad}
Cantidad: ${cantidad}`;

  const mensajeCodificado = encodeURIComponent(mensaje);

  const telefono = "5493564242625"; // Cambia por tu número

  const url = `https://wa.me/${telefono}?text=${mensajeCodificado}`;

  // Cambiamos window.open por window.location.href para evitar bloqueo popup
  window.location.href = url;
}
</script>

</body>
</html>
