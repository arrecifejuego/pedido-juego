<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pedir mi Juego</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 40px;
      background-color: #f4f4f4;
    }
    input {
      padding: 10px;
      margin: 10px;
      width: 250px;
    }
    button {
      padding: 12px 20px;
      background-color: #25D366;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h1>Pedí tu Juego</h1>

<input type="text" id="nombre" placeholder="Nombre"><br>
<input type="text" id="localidad" placeholder="Localidad"><br>
<input type="number" id="cantidad" placeholder="Cantidad"><br>

<button onclick="enviarPedido()">Enviar por WhatsApp</button>

<script>
function enviarPedido() {
  var nombre = document.getElementById("nombre").value;
  var localidad = document.getElementById("localidad").value;
  var cantidad = document.getElementById("cantidad").value;

  var mensaje = "Hola, quiero pedir el juego.%0A%0A" +
                "Nombre: " + nombre + "%0A" +
                "Localidad: " + localidad + "%0A" +
                "Cantidad: " + cantidad;

  var telefono = "5493564242625"; // ← CAMBIA ESTO POR TU NUMERO

  var url = "https://wa.me/" + telefono + "?text=" + mensaje;

  window.open(url, "_blank");
}
</script>

</body>
</html>
