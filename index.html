<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Arrecife — Conseguir juego</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Tenor+Sans&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;min-height:100%;overflow-x:hidden;}
body{
  background:#050a0e;color:white;
  font-family:'Tenor Sans',sans-serif;
  position:relative;
}

/* FONDO */
.ocean{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
.wave{position:absolute;width:200%;height:200%;left:-50%;top:-50%;
  background:radial-gradient(circle at center,rgba(80,180,200,0.035),transparent 60%);
  animation:rotateWave 55s linear infinite;}
.wave2{animation-duration:85s;opacity:0.5;transform:scale(1.25);}
.wave3{animation-duration:120s;opacity:0.2;transform:scale(1.45);}
@keyframes rotateWave{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* CANVAS */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* CONTENEDOR PRINCIPAL */
.main{
  position:relative;z-index:2;
  max-width:900px;margin:0 auto;
  padding:70px 24px 100px;
}

/* HEADER */
.logo{font-size:10px;letter-spacing:10px;opacity:0.3;text-align:center;margin-bottom:28px;text-transform:uppercase;}
h1{
  font-family:'Cormorant Garamond',serif;
  font-weight:300;font-size:48px;letter-spacing:2px;
  text-align:center;margin-bottom:10px;
}
.sub{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:15px;opacity:0.35;text-align:center;margin-bottom:60px;
}

/* GALERÍA DE FOTOS */
.galeria{
  display:grid;
  grid-template-columns:1fr 1.6fr;
  grid-template-rows:auto auto;
  gap:16px;
  margin-bottom:70px;
}
.foto{
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.07);
  position:relative;
}
.foto img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  transition:transform 0.8s ease, filter 0.8s ease;
  filter:brightness(0.85) saturate(0.9);
}
.foto:hover img{
  transform:scale(1.03);
  filter:brightness(1) saturate(1.1);
}
.foto-label{
  position:absolute;bottom:12px;left:14px;
  font-size:9px;letter-spacing:3px;opacity:0.5;
  text-transform:uppercase;
}

/* SEPARADOR */
.linea{width:60px;height:1px;background:rgba(100,210,230,0.2);margin:0 auto 60px;}

/* PRECIO */
.precio-section{text-align:center;margin-bottom:60px;}
.precio-hint{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:14px;opacity:0.4;letter-spacing:1px;margin-bottom:32px;
  transition:opacity 0.5s;
}
.precio-hint.equilibrado{opacity:0.7;color:rgba(100,210,230,0.9);}

/* NÚMERO PRECIO — dígitos flotantes */
.precio-display{
  display:flex;align-items:center;justify-content:center;
  gap:2px;margin-bottom:40px;height:80px;
  position:relative;
}
.digito{
  font-family:'Cormorant Garamond',serif;
  font-size:64px;font-weight:300;line-height:1;
  display:inline-block;
  transition:transform 0.15s ease, opacity 0.3s;
  color:rgba(255,255,255,0.9);
}
.digito.prefijo{font-size:40px;opacity:0.6;align-self:flex-start;margin-top:8px;}

/* BARRA OCEÁNICA */
.barra-wrap{
  position:relative;
  width:320px;margin:0 auto 16px;
  height:56px;
  display:flex;align-items:center;justify-content:center;
}

/* agua de fondo */
.barra-agua{
  position:absolute;inset:0;
  border:1px solid rgba(100,210,230,0.2);
  background:rgba(100,210,230,0.03);
  overflow:hidden;
}
.barra-agua::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(100,210,230,0.04),transparent);
  animation:shimmer-agua 3s ease-in-out infinite;
}
@keyframes shimmer-agua{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* línea central */
.barra-centro{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:1px;height:70%;
  background:rgba(100,210,230,0.25);
  z-index:1;
}

/* la ola / slider */
.barra-ola{
  position:absolute;
  width:60px;height:36px;
  cursor:grab;z-index:3;
  user-select:none;touch-action:none;
}
.barra-ola:active{cursor:grabbing;}
.ola-svg{width:100%;height:100%;overflow:visible;}

/* indicador de equilibrio */
.equilibrio-glow{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:12px;height:12px;border-radius:50%;
  background:rgba(100,210,230,0);
  box-shadow:0 0 0 rgba(100,210,230,0);
  transition:background 0.4s,box-shadow 0.4s;
  z-index:2;pointer-events:none;
}
.equilibrio-glow.activo{
  background:rgba(100,210,230,0.6);
  box-shadow:0 0 20px rgba(100,210,230,0.4),0 0 40px rgba(100,210,230,0.2);
}

.barra-labels{
  display:flex;justify-content:space-between;
  width:320px;margin:0 auto 8px;
  font-size:9px;letter-spacing:2px;opacity:0.2;
  text-transform:uppercase;
}

.marea-label{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:12px;opacity:0;letter-spacing:1px;
  text-align:center;
  color:rgba(100,210,230,0.8);
  transition:opacity 0.6s;
  margin-top:10px;
  min-height:20px;
}
.marea-label.visible{opacity:1;}

/* BARRA VERTICAL DE PROGRESO */
.barra-progreso-wrap{
  position:absolute;
  right:-36px;top:50%;
  transform:translateY(-50%);
  width:10px;height:80px;
  display:flex;flex-direction:column;
  align-items:center;gap:4px;
}
.barra-progreso-bg{
  width:4px;flex:1;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(100,210,230,0.12);
  position:relative;overflow:hidden;
  border-radius:2px;
}
.barra-progreso-fill{
  position:absolute;
  bottom:0;left:0;right:0;
  height:0%;
  background:linear-gradient(to top,rgba(100,210,230,0.9),rgba(100,210,230,0.3));
  transition:height 0.15s ease;
  border-radius:2px;
}
.barra-progreso-label{
  font-size:7px;letter-spacing:1px;opacity:0.25;
  text-transform:uppercase;writing-mode:vertical-rl;
  transform:rotate(180deg);margin-top:2px;
}


/* FORMULARIO — oculto hasta equilibrar */
.formulario{
  max-width:360px;margin:0 auto;
  opacity:0;pointer-events:none;
  transform:translateY(20px);
  transition:opacity 0.8s ease,transform 0.8s ease;
}
.formulario.visible{opacity:1;pointer-events:auto;transform:translateY(0);}

.input-group{margin-bottom:6px;}
.error-msg{
  font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(220,130,130,0.8);text-align:left;
  padding:5px 5px 8px;min-height:22px;
  opacity:0;transform:translateY(-4px);
  transition:opacity 0.3s,transform 0.3s;
}
.error-msg.visible{opacity:1;transform:translateY(0);}
input{
  width:100%;background:transparent;border:none;
  border-bottom:1px solid rgba(255,255,255,0.15);
  padding:16px 5px 14px;color:white;
  font-family:'Tenor Sans',sans-serif;
  font-size:13px;letter-spacing:2px;outline:none;
  transition:border-color 0.4s,box-shadow 0.4s;
}
input:focus{border-bottom-color:rgba(100,210,230,0.5);box-shadow:0 6px 20px rgba(100,210,230,0.05);}
input::placeholder{color:rgba(255,255,255,0.25);letter-spacing:2px;font-size:11px;text-transform:uppercase;}
input.error{border-bottom-color:rgba(220,100,100,0.6)!important;}

.btn-enviar{
  display:block;margin:24px auto 0;
  background:transparent;border:1px solid rgba(255,255,255,0.2);
  color:white;padding:14px 48px;
  font-family:'Tenor Sans',sans-serif;
  font-size:11px;letter-spacing:4px;cursor:pointer;text-transform:uppercase;
  transition:all 0.3s;position:relative;overflow:hidden;
}
.btn-enviar::before{content:'';position:absolute;inset:0;background:rgba(100,210,230,0.07);opacity:0;transition:opacity 0.3s;}
.btn-enviar:hover::before{opacity:1;}
.btn-enviar:hover{border-color:rgba(100,210,230,0.45);box-shadow:0 0 28px rgba(100,210,230,0.1);}

/* CONFIRMACIÓN */
.confirmacion{
  position:fixed;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:10;opacity:0;pointer-events:none;
  transition:opacity 0.8s ease 0.4s;text-align:center;
}
.confirmacion.visible{opacity:1;pointer-events:auto;}
.confirm-symbol{
  font-family:'Cormorant Garamond',serif;font-size:72px;font-weight:300;
  color:rgba(100,210,230,0.7);line-height:1;margin-bottom:24px;
  animation:pulse-glow 3s ease-in-out infinite;
}
@keyframes pulse-glow{
  0%,100%{opacity:0.7;text-shadow:0 0 30px rgba(100,210,230,0.2)}
  50%{opacity:1;text-shadow:0 0 60px rgba(100,210,230,0.4)}
}
.confirm-titulo{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;letter-spacing:2px;margin-bottom:10px;}
.confirm-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;opacity:0.4;letter-spacing:1px;}

/* CONTENEDOR QUE SE HUNDE */
.hundible{transition:transform 0.8s cubic-bezier(0.4,0,0.2,1),opacity 0.8s ease;}
.hundible.sinking{transform:translateY(80px) scale(0.95);opacity:0;}

@media(max-width:600px){
  h1{font-size:36px;}
  .galeria{grid-template-columns:1fr;}
  .digito{font-size:48px;}
  .barra-wrap,.barra-labels{width:260px;}
}
</style>
</head>

<script>
/* ============================
   CANVAS FONDO
============================ */
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H;
const bgRipples = [];

function resizeCanvas(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function addRipple(x,y,color){
  bgRipples.push({x,y,r:0,alpha:0.7,speed:2+Math.random(),color:color||'100,210,230'});
}

function bgLoop(){
  requestAnimationFrame(bgLoop);
  ctx.clearRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#010d14'); grad.addColorStop(1,'#000608');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  const luz=ctx.createRadialGradient(W*.5,-H*.1,0,W*.5,H*.3,W*.65);
  luz.addColorStop(0,'rgba(40,100,140,0.05)'); luz.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=luz; ctx.fillRect(0,0,W,H);
  for(let i=bgRipples.length-1;i>=0;i--){
    const r=bgRipples[i];
    r.r+=r.speed; r.alpha-=0.004;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${r.color},${r.alpha*0.22})`; ctx.lineWidth=1.2; ctx.stroke();
    if(r.alpha<=0) bgRipples.splice(i,1);
  }
}
bgLoop();

/* ============================
   AUDIO
============================ */
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
function tone(freq,dur,type,vol,delay=0){
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  const now=audioCtx.currentTime+delay;
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,now);
  g.gain.linearRampToValueAtTime(vol,now+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(now); o.stop(now+dur);
}
function sonarOla(){ tone(180,0.3,'sine',0.012); tone(240,0.2,'sine',0.006,0.08); }
function sonarEquilibrio(){
  tone(440,0.6,'sine',0.02); tone(660,0.8,'sine',0.012,0.15); tone(880,0.6,'sine',0.006,0.32);
}
function sonarInput(){ tone(320,0.05,'sine',0.01); }
function sonarEnviar(){
  tone(420,0.12,'sine',0.025); tone(620,0.2,'triangle',0.012,0.08);
}
function sonarError(){ tone(160,0.12,'sawtooth',0.008); tone(140,0.15,'sawtooth',0.005,0.08); }

/* ============================
   PRECIO — DÍGITOS FLOTANTES
============================ */
const PRECIO_REAL = [4,9,6,0,0]; // 49600
const PRECIO_STR  = ['4','9','6','0','0'];

const display = document.getElementById('precio-display');

// crear dígitos
const digitoEls = [];
// prefijo $
const pref = document.createElement('span');
pref.className='digito prefijo'; pref.textContent='$';
display.appendChild(pref);

PRECIO_STR.forEach((d,i)=>{
  const span=document.createElement('span');
  span.className='digito';
  span.textContent=d;
  span.dataset.target=d;
  display.appendChild(span);
  digitoEls.push(span);
});

// estado de caos de cada dígito
let caosLevel = 1.0; // 1=máximo caos, 0=equilibrio

function digitoAleatorio(){
  return String(Math.floor(Math.random()*10));
}

let digitoInterval = null;
function iniciarCaos(){
  digitoInterval = setInterval(()=>{
    digitoEls.forEach((el,i)=>{
      if(caosLevel > 0.05){
        // probabilidad de cambiar según caos
        if(Math.random() < caosLevel * 0.7){
          el.textContent = digitoAleatorio();
        } else {
          el.textContent = PRECIO_STR[i];
        }
        // movimiento flotante
        const tx = (Math.random()-0.5)*caosLevel*22;
        const ty = (Math.random()-0.5)*caosLevel*18;
        const rot = (Math.random()-0.5)*caosLevel*15;
        el.style.transform = `translate(${tx}px,${ty}px) rotate(${rot}deg)`;
        el.style.opacity = 0.5 + (1-caosLevel)*0.5;
      } else {
        // equilibrado — dígitos correctos, quietos
        el.textContent = PRECIO_STR[i];
        el.style.transform = 'translate(0,0) rotate(0deg)';
        el.style.opacity = '1';
      }
    });
    // también el prefijo
    pref.style.transform = caosLevel>0.05
      ? `translateY(${(Math.random()-0.5)*caosLevel*10}px)`
      : 'translateY(0)';
    pref.style.opacity = 0.4 + (1-caosLevel)*0.25;
  }, 80);
}
iniciarCaos();

/* ============================
   BARRA OCEÁNICA
============================ */
const olaEl   = document.getElementById('barra-ola');
const barraWrap = document.getElementById('barra-wrap');
const eqGlow  = document.getElementById('eq-glow');
const mareaLabel = document.getElementById('marea-label');
const precioHint = document.getElementById('precio-hint');
const formularioEl = document.getElementById('formulario');

const BARRA_W = 320; // ancho lógico
const OLA_W   = 60;
let olaX = 0.85;
let olaVel = 0;
let olaTarget = 0;
let equilibrado = false;
let progreso = 0;
let completado = false;
let autoCalmaTimer = null;
let dragging = false;
let dragStartX = 0;
let dragStartY = 0;
let olaStartX = 0;

// física de la ola — oscila sola
let olaAngle = Math.PI * 0.5;
let oscAmplitud = 1.0;

function olaLoop(){
  requestAnimationFrame(olaLoop);

  if(!dragging){
    // oscilación natural suave
    olaAngle += 0.038;
    const wave = Math.sin(olaAngle) * oscAmplitud;
    const diff = wave - olaX;
    olaVel += diff * 0.022;
    olaVel *= 0.90;
    olaX += olaVel;
  }

  // limitar a los bordes
  const maxX = (BARRA_W - OLA_W) / 2 / (BARRA_W/2);
  olaX = Math.max(-maxX, Math.min(maxX, olaX));

  // posición en px dentro del wrapper
  const px = olaX * (BARRA_W/2);
  olaEl.style.left = `calc(50% + ${px}px - ${OLA_W/2}px)`;

  // nivel de caos según distancia al centro
  const dist = Math.abs(olaX);
  caosLevel = Math.min(1, dist / 0.3);

  // zona central ampliada — más fácil en mobile
  const EQ_UMBRAL = 0.22;
  const estaEq = dist < EQ_UMBRAL;

  // BARRA DE PROGRESO
  const barraFill = document.getElementById('barra-fill');
  const FILL_SPEED  = 1 / (4 * 60);  // 4 segundos a 60fps = 1
  const DRAIN_SPEED = 1 / (8 * 60);  // se vacía a la mitad de velocidad

  if(estaEq && !equilibrado){
    // llenar — más rápido cuanto más centrado
    const bonus = 1 - (dist / EQ_UMBRAL); // 0 a 1
    progreso = Math.min(1, progreso + FILL_SPEED * (1 + bonus));
    if(barraFill) barraFill.style.height = (progreso*100) + '%';

    // caos visual reduce con el progreso
    caosLevel = Math.min(1, dist / 0.3) * (1 - progreso * 0.8);

    // glow parcial según progreso
    if(barraFill){
      const alpha = 0.2 + progreso * 0.5;
      barraFill.style.boxShadow = `0 0 ${progreso*12}px rgba(100,210,230,${alpha})`;
    }

    if(progreso >= 1 && !completado){
      completado = true;
      equilibrado = true;
      eqGlow.classList.add('activo');
      mareaLabel.classList.add('visible');
      precioHint.classList.add('equilibrado');
      precioHint.textContent = 'el juego es tuyo';
      oscAmplitud = 0.02;
      sonarEquilibrio();
      addRipple(W/2, H/2);
      setTimeout(()=>{ formularioEl.classList.add('visible'); }, 800);
      clearTimeout(autoCalmaTimer);
    }
  } else if(!estaEq){
    // vaciar a medias — nunca desde cero, solo retrocede
    progreso = Math.max(0, progreso - DRAIN_SPEED);
    if(barraFill) barraFill.style.height = (progreso*100) + '%';
    if(barraFill) barraFill.style.boxShadow = 'none';

    // si estaba completado y se sale, resetear para que tenga que volver
    if(completado){
      completado = false;
      equilibrado = false;
      eqGlow.classList.remove('activo');
      mareaLabel.classList.remove('visible');
      precioHint.classList.remove('equilibrado');
      precioHint.textContent = 'si me equilibrás, el juego se vuelve cada vez más tuyo';
      oscAmplitud = 1.0;
      formularioEl.classList.remove('visible');
    }
  }

  // auto-calma: después de 18s sin tocar, la ola se calma sola
  if(!dragging && oscAmplitud > 0.1){
    clearTimeout(autoCalmaTimer);
    autoCalmaTimer = setTimeout(()=>{
      oscAmplitud = 0.015;
    }, 18000);
  }
}
olaLoop();

// DRAG — desktop
olaEl.addEventListener('mousedown', e=>{
  if(audioCtx.state==='suspended') audioCtx.resume();
  dragging=true;
  dragStartX=e.clientX;
  olaStartX=olaX;
  oscAmplitud=0.7; // reactivar oscilación
  clearTimeout(autoCalmaTimer);
  e.preventDefault();
});
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  const dx = (e.clientX - dragStartX) / (BARRA_W/2);
  olaX = Math.max(-1, Math.min(1, olaStartX + dx));
  sonarOla();
  addRipple(e.clientX, e.clientY);
});
window.addEventListener('mouseup', ()=>{ dragging=false; });

// DRAG — mobile
olaEl.addEventListener('touchstart', e=>{
  if(audioCtx.state==='suspended') audioCtx.resume();
  dragging=true;
  dragStartX=e.touches[0].clientX;
  dragStartY=e.touches[0].clientY;
  olaStartX=olaX;
  oscAmplitud=0.7;
  clearTimeout(autoCalmaTimer);
},{passive:true});

olaEl.addEventListener('touchmove', e=>{
  if(!dragging) return;
  const dx=e.touches[0].clientX-dragStartX;
  const dy=e.touches[0].clientY-dragStartY;
  // solo bloquear scroll si el gesto es más horizontal que vertical
  if(Math.abs(dx)>Math.abs(dy)){
    e.preventDefault();
    olaX=Math.max(-1,Math.min(1,olaStartX+dx/(BARRA_W/2)));
    sonarOla();
    addRipple(e.touches[0].clientX, e.touches[0].clientY);
  } else {
    dragging=false; // gesto vertical = scroll normal
  }
},{passive:false});
window.addEventListener('touchend', ()=>{ dragging=false; });
window.addEventListener('touchcancel', ()=>{ dragging=false; });

/* ============================
   VALIDACIÓN Y ENVÍO
============================ */
function setError(id,msg){
  document.getElementById(id).classList.add('error');
  const e=document.getElementById('err-'+id);
  e.textContent=msg; e.classList.add('visible');
}
function clearError(id){
  document.getElementById(id).classList.remove('error');
  const e=document.getElementById('err-'+id);
  e.textContent=''; e.classList.remove('visible');
}

document.querySelectorAll('input').forEach(inp=>{
  inp.addEventListener('focus',()=>{ if(audioCtx.state==='suspended') audioCtx.resume(); sonarInput(); clearError(inp.id); });
  inp.addEventListener('keydown',()=>sonarInput());
});

document.getElementById('btnEnviar').addEventListener('click',function(){
  if(audioCtx.state==='suspended') audioCtx.resume();
  ['nombre','localidad','cantidad'].forEach(clearError);
  const nombre=document.getElementById('nombre').value.trim();
  const localidad=document.getElementById('localidad').value.trim();
  const cantidad=document.getElementById('cantidad').value.trim();
  let err=false;
  if(!nombre){setError('nombre','el mar necesita tu nombre');err=true;}
  if(!localidad){setError('localidad','¿desde qué costa escribís?');err=true;}
  if(!cantidad||isNaN(cantidad)||parseInt(cantidad)<1){setError('cantidad','indicá cuántos arrecifes');err=true;}
  if(err){sonarError();return;}
  sonarEnviar();
  this.textContent='enviando…';
  setTimeout(()=>document.getElementById('main-content').classList.add('sinking'),300);
  setTimeout(()=>document.getElementById('confirmacion').classList.add('visible'),900);
  const msg=`Hola Eze.\nQuería consultar por ARRECIFE.\n\nNombre: ${nombre}\nLocalidad: ${localidad}\nCantidad: ${cantidad}`;
  setTimeout(()=>window.open(`https://wa.me/5493564242625?text=${encodeURIComponent(msg)}`,'_blank'),950);
});

// ondas en clicks generales
document.addEventListener('click', e=>addRipple(e.clientX, e.clientY));
</script>
