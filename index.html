<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pedir mi Juego</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background-color: #f4f4f4;
    }
    input {
      padding: 10px;
      margin: 10px;
      width: 250px;
      font-size: 16px;
    }
    button {
      padding: 12px 20px;
      background-color: #25D366;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
    }
    button:hover {
      background-color: #1ebe57;
    }
  </style>
</head>
<body>

<h1>Pedí tu Juego</h1>

<input type="text" id="nombre" placeholder="Nombre" />
<br />
<input type="text" id="localidad" placeholder="Localidad" />
<br />
<input type="number" id="cantidad" placeholder="Cantidad" min="1" />
<br />

<button id="btnEnviar">Enviar por WhatsApp</button>

<script>
document.getElementById('btnEnviar').addEventListener('click', function() {
  const nombre = document.getElementById("nombre").value.trim();
  const localidad = document.getElementById("localidad").value.trim();
  const cantidad = document.getElementById("cantidad").value.trim();

  if (!nombre || !localidad || !cantidad) {
    alert("Por favor completa todos los campos.");
    return;
  }

  const mensaje = `Hola, quiero pedir el juego.
Nombre: ${nombre}
Localidad: ${localidad}
Cantidad: ${cantidad}`;

  const mensajeCodificado = encodeURIComponent(mensaje);

  const telefono = "5493564242625"; // Cambia por tu número

  const url = `https://wa.me/${telefono}?text=${mensajeCodificado}`;

  try {
    // Intentamos abrir en nueva pestaña
    const nuevaVentana = window.open(url, '_blank');

    if (!nuevaVentana || nuevaVentana.closed || typeof nuevaVentana.closed == 'undefined') {
      alert('Por favor permite ventanas emergentes para esta página para enviar el mensaje por WhatsApp.');
    }
  } catch (error) {
    alert('Error al intentar abrir WhatsApp: ' + error.message);
  }
});
</script>

</body>
</html>
