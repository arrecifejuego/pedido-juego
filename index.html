<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Arrecife — Conseguir juego</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Tenor+Sans&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}

body{
  background:#050a0e;
  color:white;
  font-family:'Tenor Sans',sans-serif;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

/* CANVAS FONDO */
#bg-canvas{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* OCEANO */
.ocean{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}
.wave{
  position:absolute;
  width:200%;height:200%;
  left:-50%;top:-50%;
  background:radial-gradient(circle at center,rgba(80,180,200,0.035),transparent 60%);
  animation:rotateWave 55s linear infinite;
}
.wave2{animation-duration:85s;opacity:0.5;transform:scale(1.25);}
.wave3{animation-duration:120s;opacity:0.2;transform:scale(1.45);}
@keyframes rotateWave{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* CRIATURAS */
.deep-sea{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.creature{
  position:absolute;
  border:1px solid rgba(100,200,220,0.12);
  opacity:0.12;
  border-radius:50%;
  filter:blur(0.5px);
}
.creature1{
  width:520px;height:140px;
  left:-620px;top:22%;
  animation:swim1 75s linear infinite;
}
.creature2{
  width:300px;height:300px;
  border-radius:35%;
  right:-380px;top:65%;
  transform:rotate(45deg);
  animation:swim2 100s linear infinite;
}
.creature3{
  width:160px;height:60px;
  left:-200px;top:55%;
  animation:swim1 45s linear infinite 12s;
  opacity:0.08;
}
@keyframes swim1{
  from{transform:translateX(0) translateY(0) rotate(0deg)}
  to{transform:translateX(2600px) translateY(40px) rotate(5deg)}
}
@keyframes swim2{
  from{transform:translateX(0) rotate(45deg)}
  to{transform:translateX(-2600px) rotate(95deg)}
}

/* CONTENEDOR */
.container{
  width:380px;
  text-align:center;
  position:relative;
  z-index:2;
  transition:transform 0.8s cubic-bezier(0.4,0,0.2,1), opacity 0.8s ease;
}
.container.sinking{
  transform:translateY(80px) scale(0.95);
  opacity:0;
}

/* LOGO */
.logo{
  font-family:'Tenor Sans',sans-serif;
  font-size:11px;
  letter-spacing:8px;
  opacity:0.45;
  margin-bottom:28px;
  text-transform:uppercase;
}

/* TITULO */
h1{
  font-family:'Cormorant Garamond',serif;
  font-size:42px;
  font-weight:300;
  margin-bottom:8px;
  letter-spacing:1px;
  color:rgba(255,255,255,0.92);
}

/* SUBTEXTO */
.subtexto{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:15px;
  opacity:0.38;
  margin-bottom:40px;
  line-height:1.8;
  font-weight:300;
}

/* LINEA */
.linea{
  width:80px;height:1px;
  background:rgba(100,200,220,0.2);
  margin:0 auto 38px;
}

/* INPUTS */
.input-group{
  margin-bottom:6px;
  position:relative;
}

.field-wrapper{
  position:relative;
}

input{
  width:100%;
  background:transparent;
  border:none;
  border-bottom:1px solid rgba(255,255,255,0.15);
  padding:16px 5px 14px;
  color:white;
  font-family:'Tenor Sans',sans-serif;
  font-size:13px;
  letter-spacing:2px;
  outline:none;
  transition:border-color 0.4s, box-shadow 0.4s;
}
input:focus{
  border-bottom-color:rgba(100,210,230,0.5);
  box-shadow:0 6px 20px rgba(100,210,230,0.05);
}
input::placeholder{
  color:rgba(255,255,255,0.25);
  letter-spacing:2px;
  font-size:11px;
  text-transform:uppercase;
}
input.error{
  border-bottom-color:rgba(220,100,100,0.6) !important;
}

/* MENSAJE DE ERROR */
.error-msg{
  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:rgba(220,130,130,0.8);
  text-align:left;
  padding:5px 5px 8px;
  min-height:22px;
  opacity:0;
  transform:translateY(-4px);
  transition:opacity 0.3s, transform 0.3s;
}
.error-msg.visible{
  opacity:1;
  transform:translateY(0);
}

/* BOTON */
.btn-wrapper{
  margin-top:18px;
  position:relative;
}
button{
  padding:14px 44px;
  background:transparent;
  border:1px solid rgba(255,255,255,0.28);
  color:white;
  letter-spacing:4px;
  cursor:pointer;
  transition:background 0.35s, border-color 0.35s, box-shadow 0.35s, transform 0.15s;
  font-family:'Tenor Sans',sans-serif;
  font-size:11px;
  text-transform:uppercase;
  position:relative;
  overflow:hidden;
}
button::before{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(100,210,230,0.06);
  opacity:0;
  transition:opacity 0.3s;
}
button:hover::before{opacity:1;}
button:hover{
  border-color:rgba(100,210,230,0.5);
  box-shadow:0 0 30px rgba(100,210,230,0.12);
}
button:active{transform:scale(0.98);}
button.loading{
  pointer-events:none;
  opacity:0.6;
  letter-spacing:3px;
}

/* CONFIRMACION */
.confirmacion{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:10;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.8s ease 0.4s;
  text-align:center;
}
.confirmacion.visible{
  opacity:1;
  pointer-events:auto;
}
.confirm-symbol{
  font-family:'Cormorant Garamond',serif;
  font-size:72px;
  font-weight:300;
  color:rgba(100,210,230,0.7);
  line-height:1;
  margin-bottom:24px;
  animation:pulse-glow 3s ease-in-out infinite;
}
@keyframes pulse-glow{
  0%,100%{opacity:0.7;text-shadow:0 0 30px rgba(100,210,230,0.2)}
  50%{opacity:1;text-shadow:0 0 60px rgba(100,210,230,0.4)}
}
.confirm-titulo{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;
  font-weight:300;
  letter-spacing:2px;
  margin-bottom:10px;
}
.confirm-sub{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:14px;
  opacity:0.4;
  letter-spacing:1px;
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="ocean">
  <div class="wave"></div>
  <div class="wave wave2"></div>
  <div class="wave wave3"></div>
</div>

<div class="deep-sea">
  <div class="creature creature1"></div>
  <div class="creature creature2"></div>
  <div class="creature creature3"></div>
</div>

<!-- FORMULARIO -->
<div class="container" id="form-container">

  <div class="logo">Arrecife</div>

  <h1>Solicitar acceso</h1>

  <div class="subtexto">
    Cada grupo encuentra<br>un arrecife distinto.
  </div>

  <div class="linea"></div>

  <div class="input-group">
    <div class="field-wrapper">
      <input type="text" id="nombre" placeholder="Nombre" autocomplete="off"/>
    </div>
    <div class="error-msg" id="err-nombre"></div>
  </div>

  <div class="input-group">
    <div class="field-wrapper">
      <input type="text" id="localidad" placeholder="Localidad" autocomplete="off"/>
    </div>
    <div class="error-msg" id="err-localidad"></div>
  </div>

  <div class="input-group">
    <div class="field-wrapper">
      <input type="number" id="cantidad" placeholder="Cantidad de juegos" min="1" autocomplete="off"/>
    </div>
    <div class="error-msg" id="err-cantidad"></div>
  </div>

  <div class="btn-wrapper">
    <button id="btnEnviar">Enviar señal</button>
  </div>

</div>

<!-- CONFIRMACION -->
<div class="confirmacion" id="confirmacion">
  <div class="confirm-symbol">~</div>
  <div class="confirm-titulo">Señal enviada</div>
  <div class="confirm-sub">el mar recibió tu mensaje</div>
</div>

<script>
/* ============================
   CANVAS — BURBUJAS + PARTICULAS
============================ */
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, bubbles = [], particles = [];
let mouseX = -1000, mouseY = -1000;

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

window.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

class Bubble {
  constructor(){this.reset(true);}
  reset(init){
    this.x = Math.random() * (W || window.innerWidth);
    this.y = init ? Math.random() * (H || window.innerHeight) : (H || window.innerHeight) + 10;
    this.r = Math.random() * 2.5 + 0.4;
    this.vy = -(Math.random() * 0.3 + 0.1);
    this.vx = (Math.random() - 0.5) * 0.12;
    this.opacity = Math.random() * 0.25 + 0.05;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.012 + 0.004;
  }
  update(){
    this.wobble += this.wobbleSpeed;
    this.x += this.vx + Math.sin(this.wobble) * 0.18;
    this.y += this.vy;
    // repulsion suave del mouse
    const dx = this.x - mouseX;
    const dy = this.y - mouseY;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if(dist < 80){
      const force = (80-dist)/80 * 0.4;
      this.x += (dx/dist)*force;
      this.y += (dy/dist)*force;
    }
    if(this.y < -10) this.reset(false);
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(100,210,230,${this.opacity})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
}

class Particle {
  constructor(){this.reset(true);}
  reset(init){
    this.x = Math.random()*(W||window.innerWidth);
    this.y = init ? Math.random()*(H||window.innerHeight) : (H||window.innerHeight)+5;
    this.size = Math.random()*1.2+0.2;
    this.vy = -(Math.random()*0.15+0.04);
    this.vx = (Math.random()-0.5)*0.06;
    this.opacity = Math.random()*0.12+0.02;
  }
  update(){
    this.x += this.vx;
    this.y += this.vy;
    if(this.y<-5) this.reset(false);
  }
  draw(){
    ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
    ctx.fillRect(this.x, this.y, this.size, this.size);
  }
}

for(let i=0;i<55;i++) bubbles.push(new Bubble());
for(let i=0;i<80;i++) particles.push(new Particle());

function loop(){
  ctx.clearRect(0,0,W,H);
  bubbles.forEach(b=>{b.update();b.draw();});
  particles.forEach(p=>{p.update();p.draw();});
  requestAnimationFrame(loop);
}
loop();

/* ============================
   AUDIO
============================ */
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();

function playTone(freq,duration,type,vol){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = vol;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+duration);
  osc.stop(audioCtx.currentTime+duration);
}

function sonarPing(){
  playTone(380,0.06,'sine',0.008);
}
function sonarFocus(){
  playTone(280,0.1,'sine',0.01);
}
function sonarEnviar(){
  playTone(440,0.15,'sine',0.025);
  setTimeout(()=>playTone(660,0.25,'triangle',0.012),100);
  setTimeout(()=>playTone(880,0.35,'sine',0.006),220);
}
function sonarError(){
  playTone(160,0.12,'sawtooth',0.008);
  setTimeout(()=>playTone(140,0.15,'sawtooth',0.005),80);
}

/* ============================
   VALIDACION
============================ */
function setError(id, msg){
  const input = document.getElementById(id);
  const err = document.getElementById('err-'+id);
  input.classList.add('error');
  err.textContent = msg;
  err.classList.add('visible');
}
function clearError(id){
  const input = document.getElementById(id);
  const err = document.getElementById('err-'+id);
  input.classList.remove('error');
  err.textContent = '';
  err.classList.remove('visible');
}
function clearAll(){
  ['nombre','localidad','cantidad'].forEach(clearError);
}

document.querySelectorAll('input').forEach(input=>{
  input.addEventListener('focus', ()=>{
    sonarFocus();
    clearError(input.id);
  });
  input.addEventListener('keydown', ()=> sonarPing());
});

/* ============================
   ENVIO
============================ */
document.getElementById('btnEnviar').addEventListener('mouseenter', ()=> sonarPing());

document.getElementById('btnEnviar').addEventListener('click', function(){
  clearAll();
  const nombre   = document.getElementById('nombre').value.trim();
  const localidad= document.getElementById('localidad').value.trim();
  const cantidad = document.getElementById('cantidad').value.trim();

  let hasError = false;

  if(!nombre){
    setError('nombre','el mar necesita tu nombre');
    hasError = true;
  }
  if(!localidad){
    setError('localidad','¿desde qué costa escribís?');
    hasError = true;
  }
  if(!cantidad || isNaN(cantidad) || parseInt(cantidad)<1){
    setError('cantidad','indicá cuántos arrecifes');
    hasError = true;
  }

  if(hasError){
    sonarError();
    return;
  }

  sonarEnviar();

  const btn = this;
  btn.textContent = 'enviando…';
  btn.classList.add('loading');

  // Hundir el formulario
  setTimeout(()=>{
    document.getElementById('form-container').classList.add('sinking');
  }, 300);

  // Mostrar confirmacion
  setTimeout(()=>{
    document.getElementById('confirmacion').classList.add('visible');
  }, 900);

  // Abrir WhatsApp
  const mensaje =
`Hola Eze.
Quería consultar por ARRECIFE.

Nombre: ${nombre}
Localidad: ${localidad}
Cantidad: ${cantidad}`;

  setTimeout(()=>{
    window.open(`https://wa.me/5493564242625?text=${encodeURIComponent(mensaje)}`,'_blank');
  }, 950);
});
</script>
</body>
</html>
